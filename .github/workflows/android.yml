steps:
  - name: Checkout
    uses: actions/checkout@v3

  - name: Setup Python
    uses: actions/setup-python@v4
    with:
      python-version: "3.10"

  - name: Install system deps
    run: |
      sudo apt update
      sudo apt install -y zip unzip openjdk-17-jdk wget autoconf automake libtool pkg-config libffi-dev libssl-dev

  - name: Install Python deps
    run: |
      python -m pip install --upgrade pip
      pip install buildozer cython

  - name: Ensure buildozer.spec
    run: |
      if [ ! -f buildozer.spec ]; then
        buildozer init
      fi

  - name: Build APK
    run: |
      buildozer android debug

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v3
    with:
      name: app-apk
      path: |
        bin/*.apk
        **/bin/*.apk
