name: Build APK

on:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest

```
steps:
- uses: actions/checkout@v3

- uses: actions/setup-python@v4
  with:
    python-version: "3.10"

- name: Install deps
  run: |
    sudo apt update
    sudo apt install -y zip unzip openjdk-17-jdk wget autoconf automake libtool pkg-config libffi-dev libssl-dev

- name: Install Python
  run: |
    pip install buildozer cython

- name: Build APK
  run: |
    buildozer android debug

- name: Upload APK
  uses: actions/upload-artifact@v3
  with:
    name: apk
    path: bin/*.apk
```
